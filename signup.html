<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Patient Registration</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="box">
    <h2>Patient Registration</h2>
    <p>First time visitor? Register below.</p>

    <form id="signupForm" action="register.php" method="POST" enctype="multipart/form-data" novalidate>
      <label for="first_name">First name</label>
      <input type="text" id="first_name" name="first_name">

      <label for="last_name">Last name</label>
      <input type="text" id="last_name" name="last_name">

      <label for="email">Email</label>
      <input type="email" id="email" name="email">

      <label for="password">Password</label>
      <div class="pw-wrap">
      <input type="password" id="password" name="password">
      <button type="button" class="toggle-pw" aria-label="Show password">👁️</button>
      </div>

      <label for="confirm_password">Confirm password</label>
      <div class="pw-wrap">
      <input type="password" id="confirm_password">
      <button type="button" class="toggle-pw" aria-label="Show password">👁️</button>
      </div>

      <label for="blood_group">Blood group</label>
      <select id="blood_group" name="blood_group">
        <option value="">-- Select --</option>
        <option>A+</option><option>A-</option>
        <option>B+</option><option>B-</option>
        <option>AB+</option><option>AB-</option>
        <option>O+</option><option>O-</option>
      </select>

      <label for="referral_letter">Referral letter (PDF, JPG or PNG)</label>
      <input type="file" id="referral_letter" name="referral_letter">
      <div id="preview" class="preview"></div>

      <p id="error" class="error"></p>
      <button type="submit">Register</button>
    </form>

    <p>Already registered? <a href="login.html">Log in</a></p>
  </div>
  <script src="toggle.js"></script>
  <script src="script.js"></script>
</body>
</html>
