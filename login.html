<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Patient Login</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="box">
    <h2>Patient Login</h2>
    <p id="msg" class="success"></p>

    <form action="login.php" method="POST">
      <label for="email">Email</label>
      <input type="email" id="email" name="email" required>

      <label for="password">Password</label>
      <div class="pw-wrap">
      <input type="password" id="password" name="password" required>
      <button type="button" class="toggle-pw" aria-label="Show password">👁️</button>
      </div>

      <p style="text-align:right;margin:8px 0 0;"><a href="forgot_password.php">Forgot password?</a></p>

      <button type="submit">Log in</button>
    </form>

    <p>New patient? <a href="signup.html">Register here</a></p>
  </div>

  <script src="toggle.js"></script>
  <script>
    if (location.search.includes("registered=1")) {
      document.getElementById("msg").textContent = "Registration successful. Please log in.";
    }
  </script>
</body>
</html>
